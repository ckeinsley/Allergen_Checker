[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "allergen-checker-api"
version = "0.1.0"
description = "FastAPI backend for Allergen Checker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Allergen Checker" }]
keywords = ["fastapi", "allergen", "api"]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "pillow>=10.0",
  "openai>=1.40",
  "pydantic>=2.6",
]

[project.scripts]
# Convenient local runner: `uv run allergen-api-dev`
allergen-api-dev = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.sdist]
include = [
  "src/app",
  "README.md",
  "run.sh",
]

# uv-specific developer dependency groups
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-Pillow>=10.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = false
